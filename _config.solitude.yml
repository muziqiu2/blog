# ==============================================
# Solitude 主题配置（站点级覆盖）
# 文档：https://solitude.js.org/cn/docs/hexo/configuration/site
# 说明：本文件与主题自带 _config.yml 深度合并，只需写需要覆盖的项
#       主题默认几乎全部模块 enable: false，官方演示效果需要显式开启
# ==============================================

# ---------------------------
# 构建选项
# ---------------------------
# 关闭 CSS 前缀（不 import nib）。
# 主题 _config.yml 默认是 true，但 nib 1.2.0 会拦截现代 CSS 写法导致编译报错，
# 进而产出 0 字节的 css/index.css（线上样式全部失效）：
#   1) `opacity var(--x, 0)` → nib 的 opacity() 会执行 round(n * 100)，CSS 变量无法参与运算
#   2) `linear-gradient(#fff 0 0)` → nib 的 linear-gradient() 把它当成单个 start 参数，报 "color stops required"
# 主题自带的配置模板（scripts/event/merge_config.js 的 defaultConfig）本身也是 css_prefix: false。
# 主题样式面向现代浏览器，需要前缀处已显式写出 -webkit- 等，关闭 nib 不影响渲染。
css_prefix: false

# ---------------------------
# 网站信息
# ---------------------------
site:
  name:
    class: text
    custom: 阿木
  # ⚠️ 站点 source/ 与主题 source/ 的同名文件会互相覆盖，且覆盖顺序不稳定：
  # 本地构建站点文件胜出、GitHub Actions 构建主题文件胜出（实测）。
  # 主题自带 /img/logo.png 是一张近乎纯白的图，一旦胜出，头像/返回顶部按钮就会「看起来是空白」。
  # 因此站点自有素材一律改用不冲突的文件名：site-logo.png / site-favicon.png。
  icon: /img/pwa/site-favicon.png

# ---------------------------
# 导航栏
# ---------------------------
nav:
  menu:
    首页: /
    文章:
      归档: /archives/ || fas fa-folder-closed
      分类: /categories/ || fas fa-clone
      标签: /tags/ || fas fa-tags
    友链:
      友情链接: /links/ || fas fa-user-group
    我的:
      关于: /about/ || fas fa-user
  right:
    # 随机文章按钮
    random: true

# ---------------------------
# 首页顶部
# ---------------------------
# Solitude 4 的首页顶部是「推荐内容轮播」（home-center）：
# 数据 = recommendList 配置项 + 最近 5 条带 cover 的文章，最多 5 个。
# 所以文章必须有 cover 字段，否则顶部区域为空。
hometop:
  enable: true
  recommendList:
    - order: 1
      sup: 推荐
      title: 自由播放器
      url: https://zybfq.mofashi.ltd/
      img: /img/covers/1751468545.png
      color: none

# ---------------------------
# 侧边栏
# ---------------------------
# Sticky(吸顶) / noSticky(不吸顶) 可选值：
#   about(信息卡) newestPost(最新文章) allInfo(网站信息) newest_comment(最新评论)
aside:
  home:
    noSticky: "about"
    Sticky: "allInfo"
  post:
    noSticky: "about"
    Sticky: "newestPost"
  page:
    noSticky: "about"
    Sticky: "newestPost,allInfo"
  # 侧栏位置：0 左 / 1 右
  position: 1
  my_card:
    author:
      # 站内头像（已本地化，避免外链失效）。
      # 注意：主题不会自动获取 QQ 头像，这里是直接渲染 <img src="该值">。
      img: /img/site-avatar.jpg
    description: 追逐光，成为光
    content: 记录开发日常与开源项目分享
    information:
      Github: https://github.com/muziqiu2 || fab fa-github
  toc:
    post: true
    page: false
    vague: true
  tags:
    enable: true
    limit: 20
  siteinfo:
    postcount: true
    wordcount: true
    pv: true
    uv: true
    updatetime: true
    runtimeenable: true
    runtime: "2023-02-27 00:00:00"

# ---------------------------
# 首页文章列表
# ---------------------------
index_post_list:
  direction: column # row / column
  column: 2
  cover: both

# ---------------------------
# 文章 / 页面默认值
# ---------------------------
post:
  default:
    cover:
      - /img/default_cover.jpg
    locate: China
    copyright:
      enable: true
      author: /img/site-logo.png
      license: CC BY-NC-SA 4.0
      licenurl: https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh-hans
page:
  error: true
  tags: true
  categories: true
  default:
    cover:
      - /img/default_cover.jpg

# ---------------------------
# 外观
# ---------------------------
# 主题色：深色模式 #ffc848 / 浅色模式 #425AEF
theme_color:
  dark: "#ffc848"
  light: "#425AEF"
  nav_hover_text:
    dark: "#1b1c20"
    light: "#ffffff"

display_mode:
  type: auto
  universe: false

font:
  font-size: 16px
  code-font-size: 16px
  font-family: "PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"
  code-font-family: '"JetBrains Mono", "Fira Code", monospace'

# 代码块高亮
highlight:
  enable: true
  limit: 200
  copy: true
  expand: true
  theme: mac
  color: default

# 图片懒加载
lazyload:
  enable: true
  field: site
  errorimg: /img/error_load.avif

# 全屏加载动画
loading:
  fullpage: true
  favicon: /img/pwa/site-favicon.png
  pace: true

# 图片灯箱（lightbox 需配合 fancybox 或 mediumZoom，二者只能开一个）
lightbox: true
fancybox: true
mediumZoom: false

# ---------------------------
# 右下角悬停工具栏
# ---------------------------
rightside:
  enable: true
  percent: true
  hide:
    enable: false
    translate: false
    mode: false
    aside: false

# ---------------------------
# 搜索（本地搜索，依赖 hexo-generator-searchdb 生成 search.xml）
# ---------------------------
search:
  enable: true
  type: local
  local:
    preload: true

# ---------------------------
# 页脚
# ---------------------------
footer:
  # 社交图标区（#footer_deal）
  # 左侧 left 已清空：原来这里的 Github 图标与「返回顶部」圆形头像并排，
  # 但站点已有导航栏 / 侧栏 / 页脚「项目」栏等多处 Github 入口，此处隐藏。
  information:
    # 该字段只用于「让返回顶部按钮渲染出来」——实际图标由站点后处理脚本
    # scripts/footer-tweaks.js 替换为向上的箭头图标（fas fa-arrow-up），
    # 因此这里的路径不会被真正显示，保留一个站内图片仅作兜底。
    author: /img/site-logo.png
  # 页脚分组：三项 => 三栏自动并排（#st-footer 为 flex + space-evenly）
  group:
    探索:
      归档: /archives/
      分类: /categories/
      标签: /tags/
    关于:
      友链: /links/
    项目:
      GitHub: https://github.com/muziqiu2
  beian:
    - name: 鲁ICP备2022005744号-3
      url: https://beian.miit.gov.cn/

# ---------------------------
# 外部静态资源 CDN（统一指向自建 jsDelivr 镜像）
# ---------------------------
# 主题内置的第三方库（fontawesome / fancybox / pjax / lazyload / pace / snackbar）
# 默认走 https://cdn.jsdelivr.net，国内访问慢且不稳定。
# 这里改用自建镜像 cdn-jsdelivr.mofashi.ltd（同样兼容 jsDelivr 的 /npm/ 路径规则）。
#
# 原理：主题 scripts/event/cdn.js 在 before_generate 时按下面的 CDN.* 配置
# 生成链接，取值规则来自 theme.CDN.third_party：
#   local / cdnjs / jsdelivr / unpkg / custom
# 选 custom 时使用 custom_format 模板，可用变量：
#   ${name} ${version} ${file} ${min_file} ${cdnjs_name} ${cdnjs_file} ${min_cdnjs_file}
#
# internal（主题自身的 main.js / utils.js / index.css）保持 local = 站内自托管，
# 不产生任何外链，无需改动。
#
# ⚠️ 为什么 7 个常用库不走镜像而是站内自托管（2026-09-11 实测）：
#   镜像 cdn-jsdelivr.mofashi.ltd 的「未压缩输出」路径存在截断缺陷 ——
#   不带 Accept-Encoding 请求时，返回的是官方文件的**前半段**（逐字节比对确认是严格前缀）：
#     pace.min.js 12962→4676、fancybox.umd.min.js 107599→37217、all.min.css 90169→22948、
#     pjax.min.js 23885→6857、lazyload 7267→2753、snackbar 3468→1347、fancybox.css 33000→6982
#   带压缩请求头时内容完整，因此是否踩到取决于边缘节点/缓存状态，表现为「有时正常、有时
#   报 SyntaxError: expected expression, got end of script / Fancybox is not defined」。
#   且响应带 Cache-Control: immutable（1 年），一旦缓存到坏副本会长期无法自愈。
#   故把下列 7 个库改为站内 /vendor/ 路径（文件实为官方 jsDelivr 的完整版本，已校验字节数）。
#   镜像配置保留，供未来新增的第三方库继续使用。
CDN:
  internal: local
  third_party: custom
  version: true
  custom_format: https://cdn-jsdelivr.mofashi.ltd/npm/${name}@${version}/${min_file}
  # options 优先级最高（theme scripts/event/cdn.js 里最后 Object.assign，直接覆盖上面的结果）
  # 键名 = 主题 plugins.yml 中的键；文件实体在 source/vendor/ 下，构建后需保持同层相对关系：
  #   all.min.css 里 url(../webfonts/xxx.woff2) 依赖 fontawesome/css 与 fontawesome/webfonts 的相对位置
  options:
    pace_js: /vendor/pace/pace.min.js
    pjax: /vendor/pjax/pjax.min.js
    lazyload: /vendor/lazyload/lazyload.iife.min.js
    snackbar: /vendor/snackbar/snackbar.min.js
    fancyapps_ui: /vendor/fancybox/fancybox.umd.min.js
    fancyapps_css: /vendor/fancybox/fancybox.min.css
    fontawesome: /vendor/fontawesome/css/all.min.css
