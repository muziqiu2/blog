<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img">
<defs>
  <linearGradient id="gIndigo" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#8b5cf6"/>
  </linearGradient>
  <linearGradient id="gCyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0891b2"/>
  </linearGradient>
  <linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#6366f1" stop-opacity="0.02"/>
  </linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07"/>
  </filter>
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace}
    .h1{font-size:26px;font-weight:700;fill:#0f172a}
    .h2{font-size:17px;font-weight:700;fill:#0f172a}
    .b{font-size:13px;fill:#64748b}
    .s{font-size:11.5px;fill:#64748b}
    .k{font-size:12px;font-weight:600}
  </style>
</defs>
<rect width="1200" height="1060" fill="#f8fafc"/>

  <text x="46" y="52" class="t h1">八次迭代，一条主线</text>
  <text x="46" y="80" class="t b">2026 年 6 月立项，从「能出图」到「能长期跑」——每一次发版背后都有一次真实的翻车</text>
  <rect x="46" y="94" width="60" height="4" rx="2" fill="url(#gIndigo)"/>
  <line x1="148" y1="124" x2="148" y2="968" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/><text x="120" y="183" class="m s" text-anchor="end">06-14</text><circle cx="148" cy="178" r="9" fill="#ffffff" stroke="#6366f1" stroke-width="3"/><circle cx="148" cy="178" r="3.5" fill="#6366f1"/><line x1="157" y1="178" x2="208" y2="178" stroke="#6366f1" stroke-width="1.4" stroke-dasharray="3 3"/><g filter="url(#sh)"><rect x="208" y="150" width="946" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g><rect x="208" y="150" width="4" height="88" rx="2" fill="#6366f1"/><text x="232" y="182" class="t h2">v2.0 起步 · 第一个能用的版本</text><text x="232" y="208" class="t b">一个 api.php 从 SQLite 随机取 URL 并 302 出图</text><text x="232" y="228" class="t b">当天上线，验证了「图库自持」这条路走得通</text><text x="120" y="291" class="m s" text-anchor="end">06-17</text><circle cx="148" cy="286" r="9" fill="#ffffff" stroke="#0891b2" stroke-width="3"/><circle cx="148" cy="286" r="3.5" fill="#0891b2"/><line x1="157" y1="286" x2="208" y2="286" stroke="#0891b2" stroke-width="1.4" stroke-dasharray="3 3"/><g filter="url(#sh)"><rect x="208" y="258" width="946" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g><rect x="208" y="258" width="4" height="88" rx="2" fill="#0891b2"/><text x="232" y="290" class="t h2">v3.0.x 补上管理后台</text><text x="232" y="316" class="t b">图片增删与批量导入、操作日志、登录页</text><text x="232" y="336" class="t b">修掉模态框关闭无响应等交互问题</text><text x="120" y="399" class="m s" text-anchor="end">06-18</text><circle cx="148" cy="394" r="9" fill="#ffffff" stroke="#d97706" stroke-width="3"/><circle cx="148" cy="394" r="3.5" fill="#d97706"/><line x1="157" y1="394" x2="208" y2="394" stroke="#d97706" stroke-width="1.4" stroke-dasharray="3 3"/><g filter="url(#sh)"><rect x="208" y="366" width="946" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g><rect x="208" y="366" width="4" height="88" rx="2" fill="#d97706"/><text x="232" y="398" class="t h2">v3.1.0 转向长期运维</text><text x="232" y="424" class="t b">GitHub Token 配置、备份与删除管理</text><text x="232" y="444" class="t b">版本检查加频率限制，避免浪费 API 配额</text><text x="120" y="507" class="m s" text-anchor="end">08-04</text><circle cx="148" cy="502" r="9" fill="#ffffff" stroke="#e11d48" stroke-width="3"/><circle cx="148" cy="502" r="3.5" fill="#e11d48"/><line x1="157" y1="502" x2="208" y2="502" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="3 3"/><g filter="url(#sh)"><rect x="208" y="474" width="946" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g><rect x="208" y="474" width="4" height="88" rx="2" fill="#e11d48"/><text x="232" y="506" class="t h2">v3.1.1 第一次安全清算</text><text x="232" y="532" class="t b">一轮系统性排查，修复多项注入与越权问题</text><text x="232" y="552" class="t b">从此每次发版前都会过一遍安全检查清单</text><text x="120" y="615" class="m s" text-anchor="end">08-21</text><circle cx="148" cy="610" r="9" fill="#ffffff" stroke="#059669" stroke-width="3"/><circle cx="148" cy="610" r="3.5" fill="#059669"/><line x1="157" y1="610" x2="208" y2="610" stroke="#059669" stroke-width="1.4" stroke-dasharray="3 3"/><g filter="url(#sh)"><rect x="208" y="582" width="946" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g><rect x="208" y="582" width="4" height="88" rx="2" fill="#059669"/><text x="232" y="614" class="t h2">v3.1.4 / 3.1.5 更新与性能</text><text x="232" y="640" class="t b">在线更新加固：目录剥离、并发锁、路径穿越检测</text><text x="232" y="660" class="t b">随机取图与分页重写，去掉全表扫描</text><text x="120" y="723" class="m s" text-anchor="end">08-24</text><circle cx="148" cy="718" r="9" fill="#ffffff" stroke="#6366f1" stroke-width="3"/><circle cx="148" cy="718" r="3.5" fill="#6366f1"/><line x1="157" y1="718" x2="208" y2="718" stroke="#6366f1" stroke-width="1.4" stroke-dasharray="3 3"/><g filter="url(#sh)"><rect x="208" y="690" width="946" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g><rect x="208" y="690" width="4" height="88" rx="2" fill="#6366f1"/><text x="232" y="722" class="t h2">v3.1.6 工程化与开源</text><text x="232" y="748" class="t b">Docker 一键部署 + Nginx 敏感目录防护示例</text><text x="232" y="768" class="t b">采用 MIT 协议，发行包剥离部署文件</text><text x="120" y="831" class="m s" text-anchor="end">08-25</text><circle cx="148" cy="826" r="9" fill="#ffffff" stroke="#0891b2" stroke-width="3"/><circle cx="148" cy="826" r="3.5" fill="#0891b2"/><line x1="157" y1="826" x2="208" y2="826" stroke="#0891b2" stroke-width="1.4" stroke-dasharray="3 3"/><g filter="url(#sh)"><rect x="208" y="798" width="946" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g><rect x="208" y="798" width="4" height="88" rx="2" fill="#0891b2"/><text x="232" y="830" class="t h2">v3.1.7 / 3.1.8 双模式与审查</text><text x="232" y="856" class="t b">访问模式后台可切换，修掉 rand 参数打穿 CDN 缓存</text><text x="232" y="876" class="t b">按代码审查意见集中修复，弹窗统一为自定义模态框</text><text x="120" y="939" class="m s" text-anchor="end">09-12</text><circle cx="148" cy="934" r="9" fill="#ffffff" stroke="#059669" stroke-width="3"/><circle cx="148" cy="934" r="3.5" fill="#059669"/><line x1="157" y1="934" x2="208" y2="934" stroke="#059669" stroke-width="1.4" stroke-dasharray="3 3"/><g filter="url(#sh)"><rect x="208" y="906" width="946" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g><rect x="208" y="906" width="4" height="88" rx="2" fill="#059669"/><text x="232" y="938" class="t h2">v3.2.3.5 当前版本</text><text x="232" y="964" class="t b">config.php 收敛为纯配置入口，业务拆进 lib/ 各模块</text><text x="232" y="984" class="t b">加载器与按钮微交互细节打磨</text><text x="46" y="1044" class="t s">依据仓库 git log 整理（共 142 次提交，含合并与维护类提交）。</text>
</svg>
