<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img">
<defs>
  <linearGradient id="gIndigo" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#8b5cf6"/>
  </linearGradient>
  <linearGradient id="gCyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0891b2"/>
  </linearGradient>
  <linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#6366f1" stop-opacity="0.02"/>
  </linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07"/>
  </filter>
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace}
    .h1{font-size:26px;font-weight:700;fill:#0f172a}
    .h2{font-size:17px;font-weight:700;fill:#0f172a}
    .b{font-size:13px;fill:#64748b}
    .s{font-size:11.5px;fill:#64748b}
    .k{font-size:12px;font-weight:600}
  </style>
</defs>
<rect width="1200" height="880" fill="#f8fafc"/>

  <text x="40" y="52" class="t h1">一次 API 调用的完整链路</text>
  <text x="40" y="80" class="t b">以 GET /pc.php 为例：从命中入口到写入统计数据，全程约十余行核心逻辑</text>
  <rect x="40" y="94" width="60" height="4" rx="2" fill="url(#gCyan)"/><g filter="url(#sh)"><rect x="40" y="122" width="330" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
    <rect x="40" y="122" width="4" height="92" rx="2" fill="#6366f1"/>
    <text x="60" y="150" class="t h2">① 入口分发</text><text x="60" y="174" class="t b">按访问的 PHP 文件决定取图渠道</text><text x="60" y="196" class="m s">api.php=UA 分发｜pc.php / pe.php 定点</text>
  <line x1="205" y1="214" x2="205" y2="232" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <g filter="url(#sh)"><rect x="40" y="240" width="330" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
    <rect x="40" y="240" width="4" height="92" rx="2" fill="#0891b2"/>
    <text x="60" y="268" class="t h2">② 频率限制</text><text x="60" y="292" class="t b">按 IP 双维度限流，超限直接拒绝</text><text x="60" y="314" class="m s">lib/ratelimit.php：429 Too Many</text>
  <line x1="205" y1="332" x2="205" y2="350" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <g filter="url(#sh)"><rect x="40" y="358" width="330" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
    <rect x="40" y="358" width="4" height="92" rx="2" fill="#d97706"/>
    <text x="60" y="386" class="t h2">③ 缓存判定</text><text x="60" y="410" class="t b">按 cache 参数切时间片，命中即复用</text><text x="60" y="432" class="m s">?cache=3600 → 1 小时内同图</text>
  <line x1="205" y1="450" x2="205" y2="468" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <g filter="url(#sh)"><rect x="40" y="476" width="330" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
    <rect x="40" y="476" width="4" height="92" rx="2" fill="#059669"/>
    <text x="60" y="504" class="t h2">④ 随机取图</text><text x="60" y="528" class="t b">SQLite 中按渠道随机取一条记录</text><text x="60" y="550" class="m s">ORDER BY RANDOM() LIMIT 1</text>
  <line x1="205" y1="568" x2="205" y2="586" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <g filter="url(#sh)"><rect x="40" y="594" width="330" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
    <rect x="40" y="594" width="4" height="92" rx="2" fill="#e11d48"/>
    <text x="60" y="622" class="t h2">⑤ 存在性校验</text><text x="60" y="646" class="t b">图片不可用则换一条重试</text><text x="60" y="668" class="m s">SSRF 防护 + 魔数校验</text><line x1="370" y1="640" x2="418" y2="640" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/><rect x="380" y="618" width="96" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0"/><text x="390" y="633" class="m s">按模式分支</text><g filter="url(#sh)"><rect x="430" y="122" width="730" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
    <rect x="430" y="122" width="4" height="92" rx="2" fill="#6366f1"/>
    <text x="450" y="150" class="t h2">302 跳转模式（默认）</text><text x="450" y="174" class="t b">返回 Location 指向真实图片地址，浏览器自行去图床取图</text><text x="450" y="196" class="m s">HTTP/1.1 302 Found + Location: https://free-img.mofashi.ltd/...</text><path d="M418 640 H396 V168 H418" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/><g filter="url(#sh)"><rect x="430" y="230" width="730" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
    <rect x="430" y="230" width="4" height="92" rx="2" fill="#0891b2"/>
    <text x="450" y="258" class="t h2">代理转发模式</text><text x="450" y="282" class="t b">服务器 cURL 拉取图片再转发，客户端拿不到原始地址</text><text x="450" y="304" class="m s">Content-Type: image/* + 流式输出</text><path d="M418 640 H396 V276 H418" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/><g filter="url(#sh)"><rect x="430" y="338" width="730" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
    <rect x="430" y="338" width="4" height="92" rx="2" fill="#d97706"/>
    <text x="450" y="366" class="t h2">JSON 输出</text><text x="450" y="390" class="t b">?format=json 时返回结构化地址，便于程序二次处理</text><text x="450" y="412" class="m s">{"success":true,"type":"pc","url":"https://..."}</text><path d="M418 640 H396 V384 H418" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/><g filter="url(#sh)"><rect x="40" y="724" width="1120" height="96" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
    <rect x="40" y="724" width="4" height="96" rx="2" fill="#059669"/>
    <text x="60" y="752" class="t h2">⑥ 统计落库</text><text x="60" y="776" class="t b">命中渠道计数器自增，按天聚合，首页趋势图读的正是这份数据</text><text x="60" y="798" class="m s">data/stats 日表 + 可选 APCu 内存缓存，避免每次调用都写盘</text><path d="M600 712 V724" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="205" y1="686" x2="205" y2="716" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#64748b"/></marker></defs>
</svg>
